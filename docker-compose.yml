services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://apptracker:apptracker@db:5432/apptracker
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apptracker
      POSTGRES_USER: apptracker
      POSTGRES_PASSWORD: apptracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apptracker -d apptracker"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
